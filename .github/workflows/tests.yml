name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Typst ${{ matrix.typst-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typst-version: ["0.13.1", "0.14.0", "0.15.1"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Setup Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: ${{ matrix.typst-version }}

      - name: Run smoke tests
        run: just test

      - name: Build documentation and previews
        if: matrix.typst-version == '0.15.1'
        run: just doc

      - name: Upload generated previews on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typst-${{ matrix.typst-version }}-previews
          path: |
            docs/manual.pdf
            assets/thumbnail.png
            assets/example.png
          if-no-files-found: ignore
          retention-days: 5
