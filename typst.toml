[package]
name = "spicky"
version = "0.2.0"
entrypoint = "src/lib.typ"
authors = ["Basil Feitknecht <https://0xbf.ch>"]
license = "Unlicense"
description = "A compact, customizable toolkit for clear multi-column cheatsheets."
repository = "https://github.com/bfeitknecht/spicky"
compiler = "0.13.1"
keywords = ["cheatsheet", "study", "notes", "pseudocode", "tables"]
categories = ["components", "layout"]
disciplines = ["computer-science", "mathematics"]
exclude = [
  ".github",
  ".gitignore",
  ".typstignore",
  "Justfile",
  "docs/*.typ",
  "docs/*.png",
  "docs/*.md",
  "scripts",
  "tests",
  "out",
  "dist",
]

[template]
path = "template"
entrypoint = "main.typ"
thumbnail = "assets/thumbnail.png"
